[project]
name = "spark-tuning"
version = "0.1.0"
description = "place for spark tuning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kaggle>=1.6.0",
    "pyspark>=4.2.0",
]



[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
